<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="index.css">
    <title>Facebook – Inicia sesión o regístrate</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

  <main class="container">
    <div class="intro">
      <h1>facebook</h1>
      <p>Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</p>
    </div>

    <div class="login-card">
      <form class="login-form">
        <label for="email">Correo electrónico o número de teléfono</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required />

        <button type="submit">Iniciar sesión</button>

        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        <hr />
        <button type="button" class="create-account">Crear cuenta nueva</button>
      </form>
    </div>
  </main>
</body>
</html>
